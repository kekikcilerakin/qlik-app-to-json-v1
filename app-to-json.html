<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Backup Apps</title>
  <meta name="author" content="stefan.stoichev@gmail.com">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="favicon" rel="shortcut icon" type="image/png" href="./images/preview.png" />
  <link rel="stylesheet" href="css/app-to-json.css">
  <link rel="stylesheet" href="css/jquery.dataTables.min.css">
  <script src="../../resources/assets/external/requirejs/require.js"></script>
  <style>
    #progressWrapper {
      width: 100%;
      background-color: #f3f3f3;
      margin: 20px 0;
    }

    #progressBar {
      width: 0%;
      height: 30px;
      background-color: #4caf50;
      text-align: center;
      line-height: 30px;
      color: white;
    }
  </style>
</head>

<body>
  <div class="main">
    Qlik sense app
    <button id="backup">Backup</button> &nbsp
    <img id="loadingImg" src="images/loading.gif"
      style="width: 21px; height: 21px; vertical-align: middle; display: none;">
    <span id="openDoc">No active document</span>
  </div>

  <div id="progressWrapper">
    <div id="progressBar">0% (0/0)</div>
  </div>

  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll"> Select All</th>
        <th>Qlik Sense App</th>
      </tr>
    </thead>

    <tbody id="docList"></tbody>
  </table>

  <script src="app-to-json.js"></script>
</body>

</html>
